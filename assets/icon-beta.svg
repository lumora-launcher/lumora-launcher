  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)"/>
  <rect x="23" y="23" width="466" height="466" rx="109" fill="none" stroke="url(#borderGrad)" stroke-width="6"/>
  <circle cx="256" cy="256" r="215" fill="url(#coreGlow)"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#borderGrad)" stroke-width="4" stroke-dasharray="55 28" opacity="0.65"/>

